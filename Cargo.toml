[workspace]
members = [
    "crates/oxda-sha-core",
    "crates/oxda-sha-svg",
    "crates/oxda-sha-cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
version = "0.0.0"
authors = ["aiaiaiai <engineering@aiaiaiai.org>"]
repository = "https://github.com/0x0sky/0xda-sha"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
